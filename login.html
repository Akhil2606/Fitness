<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        if (sessionStorage.sfcT) document.documentElement.classList.add("t");
      } catch (e) {}
    </script>

    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Log in | Stronger Fitness Club</title>

    <meta
      name="description"
      content="Fitness and sports programs, expert coaches and flexible membership in Hyderabad."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Hanken+Grotesk:wght@400;500;600&family=Caveat+Brush&display=swap"
    />

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/fx.css" />

    <style>
      .pwt {
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
        color: #2846f0;
        padding: 8px;
        min-width: 40px;
      }

      .pwt svg {
        width: 21px;
        height: 21px;
        display: block;
      }

      .pwt:focus-visible {
        outline: 2px solid #2846f0;
        border-radius: 5px;
      }
    </style>
  </head>

  <body class="au">
    <aside class="vis img" data-img="1534438327276-14e5300c3a48">
      <a class="logo" href="index.html" style="color: #fff">
        <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
          <rect width="24" height="24" rx="7" fill="#2846f0" />
          <path
            d="m6.5 16 5.5-8 5.5 8"
            stroke="#fff"
            stroke-width="2.6"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Stronger
      </a>

      <h2>Stronger every day, better in every way.</h2>
    </aside>

    <main>
      <div class="card">
        <h1 style="font-size: 36px">Welcome back</h1>
        <p></p>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-t="login">Log in</button>
          <button type="button" role="tab" data-t="signup">Sign up</button>
        </div>

        <!-- LOGIN FORM -->

        <form data-f="login">
          <label>
            Email
            <input
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </label>

          <label>
            Password
            <div class="pw">
              <input
                type="password"
                required
                autocomplete="current-password"
                placeholder="Enter your password"
              />

              <button type="button" class="pwt" aria-label="Show password">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </label>

          <div class="opts">
            <label>
              <input type="checkbox" />
              Remember me
            </label>

            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button class="btn dark" type="submit">Log in</button>
        </form>

        <!-- SIGNUP FORM -->

        <form data-f="signup">
          <div class="row2">
            <label>
              First name
              <input
                type="text"
                required
                autocomplete="given-name"
                placeholder="John"
              />
            </label>

            <label>
              Last name
              <input
                type="text"
                required
                autocomplete="family-name"
                placeholder="Smith"
              />
            </label>
          </div>

          <label>
            Email
            <input
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </label>

          <label>
            Password
            <div class="pw">
              <input
                type="password"
                required
                autocomplete="new-password"
                placeholder="Enter a password"
              />

              <button type="button" class="pwt" aria-label="Show password">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </label>

          <label>
            Confirm password
            <div class="pw">
              <input
                type="password"
                required
                autocomplete="new-password"
                placeholder="Re-enter your password"
              />

              <button type="button" class="pwt" aria-label="Show password">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </label>

          <label class="agree">
            <input type="checkbox" required />
            I agree to the Terms &amp; Conditions
          </label>

          <button class="btn dark" type="submit">Create account</button>
        </form>

        <!-- SUCCESS / ERROR MESSAGE -->

        <p
          class="msg"
          role="status"
          aria-live="polite"
          style="margin-top: 12px"
        ></p>

        <!-- SOCIAL LOGIN -->

        <div class="or">or continue with</div>

        <div class="soc">
          <button class="btn line" type="button" data-provider="Google">
            Google
          </button>

          <button class="btn line" type="button" data-provider="Apple">
            Apple
          </button>
        </div>

        <!-- SUPPORT -->

        <p class="help">
          Need help?
          <a href="mailto:hello@strongerclub.in">Contact support</a>
        </p>
      </div>
    </main>

    <script src="js/site.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
    <script src="js/fx.js"></script>
  </body>
</html>
